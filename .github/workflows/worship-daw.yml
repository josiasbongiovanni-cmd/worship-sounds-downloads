name: Worship DAW

on:
  push:
    paths:
      - "WorshipDAW/**"
      - ".github/workflows/worship-daw.yml"
  pull_request:
    paths:
      - "WorshipDAW/**"
  workflow_dispatch:

concurrency:
  group: worship-daw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests + build (macOS e iOS)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: WorshipDAW
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Tests del núcleo (WorshipDAWCore)
        run: swift test --package-path Packages/WorshipDAWCore

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar para macOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project WorshipDAW.xcodeproj \
            -scheme WorshipDAW-macOS \
            -destination 'generic/platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO | tee macos-build.log | grep -E "error:|warning: .*(isolat|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" macos-build.log

      - name: Compilar para iOS (simulador)
        run: |
          set -o pipefail
          xcodebuild build \
            -project WorshipDAW.xcodeproj \
            -scheme WorshipDAW-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO | tee ios-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ios-build.log

      - name: App para Mac lista para probar (Release, firma ad-hoc)
        run: |
          set -o pipefail
          xcodebuild build \
            -project WorshipDAW.xcodeproj \
            -scheme WorshipDAW-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= | tee release-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" release-build.log
          ditto -c -k --keepParent "build/Build/Products/Release/Worship DAW.app" WorshipDAW-mac.zip

      - name: Subir app de Mac
        uses: actions/upload-artifact@v4
        with:
          name: WorshipDAW-mac
          path: WorshipDAW/WorshipDAW-mac.zip
          retention-days: 30
