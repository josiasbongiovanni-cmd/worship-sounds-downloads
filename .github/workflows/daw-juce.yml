name: Worship DAW (JUCE)

# Linux: pruebas en cada push (minutos baratos).
# Windows y macOS: compilación con instalable descargable, a mano o al crear un tag v*.
on:
  push:
    paths:
      - "DAW/**"
      - ".github/workflows/daw-juce.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      windows:
        description: "Compilar para Windows"
        type: boolean
        default: true
      macos:
        description: "Compilar para macOS"
        type: boolean
        default: true

concurrency:
  group: daw-juce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: DAW
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Revisar textos UTF-8
        run: python3 lint_utf8.py
      - name: Configurar
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build
      - name: Pruebas del modelo, el motor y la superficie de control
        run: ./build/WorshipDAWTests_artefacts/Release/WorshipDAWTests

  windows:
    name: Windows (x64)
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.windows)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_PFX_BASE64 != '' }}
    defaults:
      run:
        working-directory: DAW
    steps:
      - uses: actions/checkout@v4
      # ASIO: solo si aceptaste la licencia de Steinberg (variable del repositorio ACCEPT_ASIO_LICENSE = true)
      - name: ASIO SDK de Steinberg
        if: vars.ACCEPT_ASIO_LICENSE == 'true'
        shell: pwsh
        run: .\scripts\get-asio-sdk.ps1 -AcceptLicense
      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Compilar
        run: cmake --build build --config Release --parallel
      - name: Pruebas
        run: .\build\WorshipDAWTests_artefacts\Release\WorshipDAWTests.exe
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Certificado de firma (si está configurado)
        if: env.HAS_WIN_CERT == 'true'
        shell: pwsh
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          "WIN_CERT_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Firmar y crear el instalador
        shell: pwsh
        env:
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WorshipDAW-Windows
          path: DAW/dist/*.exe
          retention-days: 14

  macos:
    name: macOS (Universal)
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    defaults:
      run:
        working-directory: DAW
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -B build -G Xcode
      - name: Compilar
        run: cmake --build build --config Release -- -quiet
      - name: Pruebas
        run: ./build/WorshipDAWTests_artefacts/Release/WorshipDAWTests
      # Firma con Developer ID: secretos MAC_CERT_P12_BASE64 y MAC_CERT_PASSWORD (certificado exportado del llavero)
      - name: Certificado Developer ID (si está configurado)
        if: env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')"
          echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY_P8_BASE64" ]; then
            echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
      - name: Firmar, notarizar y crear el .dmg
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./scripts/package-mac.sh "build/WorshipDAW_artefacts/Release/Worship DAW.app"
      - uses: actions/upload-artifact@v4
        with:
          name: WorshipDAW-macOS
          path: DAW/dist/*.dmg
          retention-days: 14

  release:
    name: Publicar versión
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
