name: WorshipDAW
options:
  bundleIdPrefix: com.worshipsounds
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  WorshipDAWCore:
    path: Packages/WorshipDAWCore

targets:
  WorshipDAW-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WorshipDAWCore
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Worship DAW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: Worship DAW usa el micrófono o tu interfaz de audio para grabar voces e instrumentos.
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      base:
        PRODUCT_NAME: Worship DAW
        PRODUCT_BUNDLE_IDENTIFIER: com.worshipsounds.daw
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme: {}

  WorshipDAW-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: WorshipDAWCore
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Worship DAW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: Worship DAW usa el micrófono o tu interfaz de audio para grabar voces e instrumentos.
        NSHumanReadableCopyright: © 2026 Worship Sounds
    settings:
      base:
        PRODUCT_NAME: Worship DAW
        PRODUCT_BUNDLE_IDENTIFIER: com.worshipsounds.daw
        CODE_SIGN_ENTITLEMENTS: Support/WorshipDAW-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}
